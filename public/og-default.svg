      <stop offset="0%" stop-color="#241e18"/>
      <stop offset="70%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#140f0b"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#lamp)"/>
  <!-- top amber light line -->
  <rect x="360" y="0" width="480" height="3" fill="#d4a054" opacity="0.55"/>
